<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="camber-brand.js?v=brand1"></script>
<script src="cloud.js?v=usuarios1"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuários · Gestão Camber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="painel.css?v=20260912215700">
<link rel="stylesheet" href="app.css?v=20260912215700">
<style>
  .u-wrap{max-width:920px;margin:0 auto;padding:28px 24px}
  .u-head h1{font-size:26px;margin:0 0 4px;color:var(--ink)}
  .u-head .sub{color:var(--ink-3);font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
  .u-head p{color:var(--ink-2);font-size:14px;margin:0 0 22px}
  .u-toolbar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--hair);border-radius:11px;padding:9px 13px;margin-bottom:14px}
  .u-toolbar .u-search-ic{color:var(--ink-3);font-size:15px;line-height:1}
  .u-toolbar input{flex:1;border:none;background:transparent;outline:none;font-family:inherit;font-size:13.5px;color:var(--ink)}
  .u-card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .u-item{border-top:1px solid var(--hair)}
  .u-item:first-child{border-top:none}
  .u-row{display:flex;align-items:center;gap:14px;padding:15px 20px;flex-wrap:wrap}
  .u-perms{padding:0 20px 16px 72px}
  .u-perms-lbl{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:8px}
  .u-chips{display:flex;flex-wrap:wrap;gap:7px}
  .u-chip{border:1px solid var(--hair-2);background:var(--surface-2);color:var(--ink-2);border-radius:18px;padding:5px 12px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit}
  .u-chip.on{background:var(--win-soft);border-color:var(--win);color:var(--win)}
  .u-chip:disabled{opacity:.6;cursor:default}
  .u-perms-foot{display:flex;align-items:center;gap:12px;margin-top:11px}
  .u-save{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
  .u-save:disabled{opacity:.6;cursor:default}
  .u-saved{font-size:12.5px;font-weight:600}
  .u-av{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-2);font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .u-info{flex:1;min-width:160px}
  .u-nome{font-weight:600;font-size:14px;color:var(--ink)}
  .u-mail{font-size:12.5px;color:var(--ink-2)}
  .u-meta{font-size:11.5px;color:var(--ink-3);margin-top:3px}
  .u-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
  .u-pend{background:var(--surface-2);color:var(--st-prop)}
  .u-ok{background:var(--win-soft);color:var(--win)}
  .u-adm{background:var(--surface-2);color:#9a6dc4}
  .u-btn{border:none;border-radius:8px;padding:8px 15px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .u-btn:disabled{opacity:.6;cursor:default}
  .u-approve{background:var(--accent);color:#fff}
  .u-revoke{background:transparent;color:var(--st-prop);border:1px solid var(--hair-2)}
  .u-promote{background:transparent;color:#9a6dc4;border:1px solid var(--hair-2)}
  .u-demote{background:transparent;color:#9a6dc4;border:1px solid var(--hair-2)}
  .u-del{background:var(--lost);color:#fff}
  .u-acoes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .u-muted{color:var(--ink-3);font-size:13.5px;padding:34px;text-align:center}
  .u-pendnote{background:var(--accent-soft);border:1px solid var(--hair);color:var(--accent-2);font-size:13px;padding:12px 16px;border-radius:10px;margin-bottom:16px}
</style>
</head>
<body>
<div class="camber skin-studio" id="app" data-page="usuarios">
  <div class="body scroll">
    <div class="u-wrap">
      <div class="u-head">
        <div class="sub">Acesso &amp; permissões</div>
        <h1>Usuários</h1>
        <p>Autorize quem pode acessar o sistema. Novos cadastros ficam <b>pendentes</b> até você liberar.</p>
      </div>
      <div class="u-toolbar" id="uToolbar" hidden>
        <span class="u-search-ic">⌕</span>
        <input id="uSearch" type="search" placeholder="Buscar por nome ou e-mail…" autocomplete="off" aria-label="Buscar usuário">
      </div>
      <div id="uPendNote"></div>
      <div class="u-card" id="uList"><div class="u-muted">Carregando…</div></div>
    </div>
  </div>
</div>
<script src="shell.js?v=brand1"></script>
<script>
(function () {
  var listEl = document.getElementById('uList');
  var noteEl = document.getElementById('uPendNote');
  function sb(){ return window.CamberCloud && window.CamberCloud.client && window.CamberCloud.client(); }
  // chama a função admin; se der erro de sessão/permissão transitório, renova e tenta 1x
  async function invokeAdmin(body){
    try {
      var client = sb();
      var r = await client.functions.invoke('aprovar-admin', { body: body });
      var err = r.error ? r.error.message : (r.data && r.data.error);
      if (r.error?.context?.status === 401 || (err && /restrito|autenticad|jwt|token|sess/i.test(err))) {
        var refreshed = await client.auth.refreshSession();
        if (refreshed.error) return {error:refreshed.error};
        r = await client.functions.invoke('aprovar-admin', { body: body });
      }
      return r;
    } catch(error) {
      return {error:error};
    }
  }
  function call(action, user_id){ return invokeAdmin({ action: action, user_id: user_id }); }
  function inicial(s){ return ((s||'?').trim().charAt(0) || '?').toUpperCase(); }
  function esc(s){ var d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
  function fmtData(iso){
    if(!iso) return null;
    var d = new Date(iso); if(isNaN(d)) return null;
    return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });
  }

  var toolbarEl = document.getElementById('uToolbar');
  var searchEl  = document.getElementById('uSearch');
  var STATE = { users: [], me: null };
  function applyFilter(){
    var q = (searchEl && searchEl.value || '').trim().toLowerCase();
    var list = !q ? STATE.users : STATE.users.filter(function(u){
      return (((u.nome||'') + ' ' + (u.email||'')).toLowerCase()).indexOf(q) >= 0;
    });
    render(list, STATE.me, q);
  }
  if(searchEl){ searchEl.addEventListener('input', applyFilter); }

  // Mantido em sincronia com a navegação (shell.js). "Usuários" fica de fora:
  // é área exclusiva de admin, não se concede a usuário comum.
  var TABS = [
    { id:'painel', t:'Painel' }, { id:'precificacao', t:'Precificação' },
    { id:'projetos', t:'Projetos' }, { id:'cotacoes', t:'Cotações' },
    { id:'fornecedores', t:'Fornecedores' }, { id:'compras', t:'Compras' },
    { id:'clientes', t:'Clientes' }, { id:'indicacoes', t:'Indicações' },
    { id:'lead', t:'Lead' }, { id:'config', t:'Configuração' }
  ];
  function setAbas(user_id, abas){
    return invokeAdmin({ action:'set_abas', user_id:user_id, abas:abas });
  }

  function metaLinha(u){
    var cad = fmtData(u.created_at || u.solicitado_em);
    var acc = fmtData(u.ultimo_acesso);
    var partes = [];
    if(cad) partes.push('Cadastrado em ' + cad);
    if(u.aprovado) partes.push('Último acesso: ' + (acc || 'ainda não acessou'));
    return partes.length ? '<div class="u-meta">'+partes.join(' · ')+'</div>' : '';
  }

  function render(list, meId, q){
    // o contador de pendentes reflete SEMPRE o total, não o resultado filtrado
    var pend = STATE.users.filter(function(u){ return !u.aprovado; }).length;
    noteEl.innerHTML = pend ? '<div class="u-pendnote">⏳ '+pend+' cadastro(s) aguardando sua autorização.</div>' : '';
    if(!STATE.users.length){ listEl.innerHTML = '<div class="u-muted">Nenhum usuário cadastrado ainda.</div>'; return; }
    if(!list.length){ listEl.innerHTML = '<div class="u-muted">Nenhum usuário encontrado para “'+esc(q||'')+'”.</div>'; return; }
    listEl.innerHTML = list.map(function(u){
      var badge = u.aprovado
        ? (u.papel==='admin' ? '<span class="u-badge u-adm">Admin</span>' : '<span class="u-badge u-ok">Ativo</span>')
        : '<span class="u-badge u-pend">Pendente</span>';
      var acoes, permsRow = '';
      if(u.id === meId){
        acoes = '<span style="color:var(--ink-3);font-size:12px;white-space:nowrap">você</span>';
      } else {
        var btns = [];
        if(u.papel === 'admin'){
          btns.push('<button class="u-btn u-demote" data-act="remove_admin" data-id="'+u.id+'">Remover admin</button>');
        } else {
          btns.push(u.aprovado
            ? '<button class="u-btn u-revoke" data-act="revoke" data-id="'+u.id+'">Bloquear</button>'
            : '<button class="u-btn u-approve" data-act="approve" data-id="'+u.id+'">Autorizar</button>');
          btns.push('<button class="u-btn u-promote" data-act="make_admin" data-id="'+u.id+'">Tornar admin</button>');
        }
        btns.push('<button class="u-btn u-del" data-act="delete" data-id="'+u.id+'">Excluir</button>');
        acoes = btns.join('');
        if(u.papel === 'admin'){
          permsRow = '<div class="u-perms"><span class="u-perms-lbl" style="color:#9a6dc4">Administrador — acesso total a todas as abas.</span></div>';
        } else {
          var abas = u.abas_permitidas || [];
          var chips = TABS.map(function(tb){
            var on = abas.indexOf(tb.id) >= 0;
            return '<button type="button" class="u-chip'+(on?' on':'')+'" data-uid="'+u.id+'" data-tab="'+tb.id+'">'+tb.t+'</button>';
          }).join('');
          permsRow = '<div class="u-perms"><span class="u-perms-lbl">Abas que pode acessar (clique para ligar/desligar e depois Salvar):</span>'+
            '<div class="u-chips">'+chips+'</div>'+
            '<div class="u-perms-foot"><button type="button" class="u-save" data-saveuid="'+u.id+'">Salvar acessos</button>'+
            '<span class="u-saved" id="saved-'+u.id+'"></span></div></div>';
        }
      }
      return '<div class="u-item"><div class="u-row"><div class="u-av">'+inicial(u.nome||u.email)+'</div>'+
        '<div class="u-info"><div class="u-nome">'+esc(u.nome||'(sem nome)')+'</div><div class="u-mail">'+esc(u.email||'')+'</div>'+metaLinha(u)+'</div>'+
        badge + '<div class="u-acoes">'+acoes+'</div></div>' + permsRow + '</div>';
    }).join('');

    // ações: autorizar / bloquear / tornar-admin / remover-admin / excluir
    listEl.querySelectorAll('button[data-act]').forEach(function(b){
      b.onclick = function(){
        var act=b.getAttribute('data-act'), id=b.getAttribute('data-id');
        function exec(){
          b.disabled=true; b.textContent='…';
          call(act, id).then(function(r){
            var err = r.error ? r.error.message : (r.data && r.data.error);
            if(err){ alert('Erro: '+err); }
            load();
          });
        }
        // Excluir usuário é a ação mais grave: exige a senha do admin (igual Fornecedor/Cliente)
        if(act==='delete'){
          var alvo = STATE.users.filter(function(x){ return String(x.id)===String(id); })[0];
          var nome = (alvo && (alvo.nome || alvo.email)) || 'este usuário';
          if(window.pedirSenhaExcluir){ window.pedirSenhaExcluir(nome, exec); return; }
          if(!confirm('EXCLUIR este usuário definitivamente?\n\nA conta será apagada e não dá para desfazer.')) return;
          exec(); return;
        }
        if(act==='revoke' && !confirm('Bloquear o acesso deste usuário?\n\nEle não conseguirá mais entrar até você liberar de novo. A conta NÃO é apagada.')) return;
        if(act==='make_admin' && !confirm('Tornar este usuário ADMINISTRADOR?\n\nEle poderá ver tudo e gerenciar usuários (autorizar, bloquear, excluir).')) return;
        if(act==='remove_admin' && !confirm('Remover o status de administrador deste usuário?\n\nEle volta a ser usuário comum, com as abas limitadas que você definir.')) return;
        exec();
      };
    });

    // toggles de abas (apenas marcam; gravam ao clicar em "Salvar acessos")
    listEl.querySelectorAll('.u-chip').forEach(function(c){
      c.onclick = function(){
        c.classList.toggle('on');
        var fb = document.getElementById('saved-'+c.getAttribute('data-uid'));
        if(fb){ fb.style.color='var(--ink-3)'; fb.textContent='alterações não salvas'; }
      };
    });
    listEl.querySelectorAll('.u-save').forEach(function(b){
      b.onclick = function(){
        var uid = b.getAttribute('data-saveuid');
        var abas = [];
        listEl.querySelectorAll('.u-chip.on[data-uid="'+uid+'"]').forEach(function(c){ abas.push(c.getAttribute('data-tab')); });
        var fb = document.getElementById('saved-'+uid);
        b.disabled = true; b.textContent = 'Salvando…';
        setAbas(uid, abas).then(function(r){
          b.disabled = false; b.textContent = 'Salvar acessos';
          var err = r.error ? r.error.message : (r.data && r.data.error);
          if(err){ if(fb){ fb.style.color='var(--lost)'; fb.textContent='Erro: '+err; } return; }
          var u = STATE.users.filter(function(x){ return x.id===uid; })[0]; if(u) u.abas_permitidas = abas;
          if(fb){ fb.style.color='var(--win)'; fb.textContent='✓ Salvo'; }
        });
      };
    });
  }

  function problem(message, retry){
    noteEl.textContent = '';
    listEl.innerHTML = '<div class="u-muted" role="status">'+esc(message)+(retry?' <button type="button" class="u-save">Tentar novamente</button>':'')+'</div>';
    if(retry) listEl.querySelector('button').onclick = retry;
  }
  async function load(){
    if(!sb()){
      if(location.protocol==='file:' || ['localhost','127.0.0.1','[::1]','0.0.0.0'].includes(location.hostname)){
        problem('Para consultar os usuários, abra o aplicativo online e entre como administrador.');
        var link = document.createElement('a');
        link.href='https://app.camberinteriores.com.br/usuarios.html';
        link.textContent='Abrir Usuários no Camber';
        listEl.firstElementChild.append(' ',link);
      }else{
        problem('Não foi possível conectar ao serviço de usuários.', function(){location.reload()});
      }
      return;
    }
    var profile = window.__camberProfile;
    if(!profile || !profile.aprovado || profile.papel!=='admin'){
      problem('Somente administradores aprovados podem consultar os usuários.');
      return;
    }
    listEl.innerHTML = '<div class="u-muted" role="status">Carregando usuários…</div>';
    try{
      var r = await call('list');
      if(r.error)throw Error('Não foi possível carregar os usuários. Verifique a conexão e a sessão.');
      if(r.data && r.data.error)throw Error(r.data.error);
      if(!Array.isArray(r.data?.users))throw Error('O serviço não retornou a lista de usuários.');
      STATE.users = r.data.users;
      STATE.me = r.data.me;
      if(toolbarEl) toolbarEl.hidden = STATE.users.length < 2; // busca só aparece quando há 2+ usuários
      applyFilter();
    }catch(error){problem(error.message,load);}
  }
  if(document.getElementById('camberHide')){
    window.addEventListener('camber-app-visivel',load,{once:true});
  }else{load();}
})();
</script>
</body>
</html>
