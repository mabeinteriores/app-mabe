<!doctype html><html lang="pt-BR"><head>
<script src="camber-brand.js?v=brand1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indicações · Camber</title><script src="cloud.js?v=brand1"></script><link rel="stylesheet" href="indicacoes-demo.css?v=2"><link rel="stylesheet" href="indicacoes-real.css?v=3"></head><body>
<main><header><div><small>CAMBER / RELACIONAMENTO</small><h1>Indicações</h1><p>Cada indicação com origem, responsável e próximo passo.</p></div></header><nav class="tabs" aria-label="Indicações"><button data-view="fila">Atendimento</button><button data-view="funil">Funil</button><button data-view="parceiros">Parceiros e links</button><button data-view="comissoes">Comissões</button><button data-view="cadastros">Cadastros</button><button data-view="nova">Nova indicação</button><button id="refresh">Atualizar</button></nav><p id="error" role="alert"></p><div id="app" aria-live="polite">Conectando ao sistema…</div></main>
<dialog id="detail"><form id="edit"><div class="dialog-head"><h2 id="detail-title"></h2><button type="button" id="close" aria-label="Fechar">✕</button></div><p id="origin"></p><p id="contact"></p><p id="notes"></p><label>Status<select name="status"></select></label><label>Responsável interno<select name="owner"></select></label><label>Próxima ação<input name="action" maxlength="200"></label><label>Data da ação<input name="due" type="date"></label><label>Valor estimado / contrato (R$)<input name="value" type="number" min="0" max="1000000000" step="0.01"></label><label id="loss-wrap" hidden>Motivo da perda<select name="lossReason"><option value="">Selecione…</option><option>Preço / orçamento acima do esperado</option><option>Prazo</option><option>Cliente desistiu / adiou</option><option>Escolheu concorrente</option><option>Sem retorno (esfriou)</option><option>Fora do perfil (escopo / região)</option><option>Outro</option></select></label><label id="loss-detail-wrap" hidden>Detalhe do motivo (opcional)<input name="lossDetail" maxlength="500"></label><p id="edit-error" role="alert"></p><button class="primary" id="save">Salvar acompanhamento</button><button type="button" id="archive">Arquivar</button><h3>Histórico</h3><ol id="history"></ol></form></dialog><div id="toast" role="status"></div><script src="indicacoes-real.js?v=9"></script></body></html>
