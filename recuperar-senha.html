<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar acesso · Camber</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f0ea;color:#3a3128;font:15px system-ui,sans-serif}.card{width:420px;max-width:100%;background:#fffdf9;padding:32px;border:1px solid #e7dccc;border-radius:20px;box-shadow:0 20px 60px #49331d0d}.brand{font-weight:700;letter-spacing:4px;color:#b6653d;margin-bottom:26px}h1{font-size:24px;margin:0 0 12px}p{font-size:14px;line-height:1.6;color:#887b6b}label{display:block;font-size:13px;margin-top:18px}input{width:100%;padding:12px;border:1px solid #dcccba;border-radius:9px;margin-top:7px;font:inherit}button{width:100%;padding:13px;margin-top:22px;border:0;border-radius:9px;background:#bd683f;color:white;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#aa603a;font-size:13px}#msg{min-height:24px;color:#8d542f}input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid #bc683f;outline-offset:3px}[hidden]{display:none!important}</style></head><body><main class="card"><div class="brand">CAMBER</div><h1 id="title">Recuperar acesso</h1><p id="intro">Informe o e-mail usado no cadastro para receber um link de recuperação.</p><form id="request"><label>E-mail<input id="email" type="email" autocomplete="email" required maxlength="254"></label><button id="send">Enviar link de recuperação</button></form><form id="reset" hidden><label>Nova senha<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirmar nova senha<input id="confirm" type="password" autocomplete="new-password" minlength="8" required></label><p>Use pelo menos 8 caracteres.</p><button id="save">Salvar nova senha</button></form><p id="msg" role="status" aria-live="polite"></p><a href="painel.html">Voltar para o login</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="recuperar-senha.js?v=1"></script></body></html>
