<aside class="side"><div class="wordmark" aria-label="Camber">camber</div><nav aria-label="Contexto da prévia"><div><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3z"/></svg>Painel</div><div><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M9 5V2h6v3M8 10h8M8 15h5"/></svg>Projetos</div><div class="current" aria-current="page"><svg viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6zM14 2v6h5M9 12h7M9 16h5"/></svg>Cotações</div><div><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-5a8 8 0 0 1 16 0v5M2 7v9M22 7v9"/></svg>Fornecedores</div><div><svg viewBox="0 0 24 24"><path d="M2 3h3l3 13h11l3-10H6M8 20h1M18 20h1"/></svg>Compras</div><div><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-5a8 8 0 0 1 16 0v5"/></svg>Clientes</div></nav><div class="side-bottom"><span class="avatar">RB</span>Rafael Bernardes</div></aside>
<main class="main"><div class="preview"><div><strong>PRÉVIA INTERATIVA</strong>Dados fictícios. Nenhum e-mail ou alteração no sistema real.</div><button id="reset">Reiniciar prévia</button></div><div id="app"></div></main>

<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(t=>p.find(x=>x.type===t).value).join('-')};
const ahead=n=>{const d=new Date(today()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const date=s=>new Date(s+'T12:00:00Z').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',timeZone:'America/Sao_Paulo'});
const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const clients=[{id:1,name:'Mariana e Lucas',project:'Residência Jardim',initials:'ML'},{id:2,name:'Escritório Horizonte',project:'Sede comercial',initials:'EH'}];
const labels={open:'Em cotação',draft:'Rascunho',paused:'Pausada',closed:'Encerrada',canceled:'Cancelada',archived:'Arquivada',trash:'Na lixeira'};
const filters=[['open','Em aberto'],['paused','Pausadas'],['closed','Encerradas'],['canceled','Canceladas'],['archived','Arquivadas'],['trash','Lixeira'],['all','Todas']];
function seed(){return [
 {id:1,client:1,service:'Marcenaria',room:'Cozinha e dormitórios',state:'open',responses:2,suppliers:3,value:48000,deadline:ahead(10),owner:'Rafael',initials:'RB'},
 {id:2,client:1,service:'Marmoraria',room:'Bancadas da cozinha',state:'open',responses:1,suppliers:2,value:6000,deadline:ahead(5),owner:'Rafael',initials:'RB'},
 {id:3,client:1,service:'Iluminação',room:'Área social',state:'draft',responses:0,suppliers:3,value:12500,deadline:ahead(12),owner:'Ana',initials:'AC'},
 {id:4,client:1,service:'Vidraçaria',room:'Boxes e espelhos',state:'paused',responses:1,suppliers:2,value:9400,deadline:ahead(8),owner:'Ana',initials:'AC',reason:'Aguardando revisão do projeto'},
 {id:5,client:1,service:'Pisos',room:'Sala e circulação',state:'closed',responses:3,suppliers:3,value:18000,deadline:ahead(3),owner:'Rafael',initials:'RB',chosen:true},
 {id:6,client:1,service:'Automação',room:'Controle de iluminação',state:'canceled',responses:2,suppliers:3,value:8000,deadline:ahead(7),owner:'Ana',initials:'AC',reason:'Cliente desistiu da contratação'},
 {id:7,client:1,service:'Paisagismo',room:'Jardim externo',state:'archived',previous:'closed',responses:2,suppliers:2,value:10000,deadline:ahead(2),owner:'Rafael',initials:'RB'},
 {id:8,client:1,service:'Cortinas',room:'Rascunho duplicado',state:'trash',previous:'draft',responses:0,suppliers:0,value:0,deadline:ahead(15),owner:'Ana',initials:'AC'},
 {id:9,client:2,service:'Mobiliário corporativo',room:'Recepção e reuniões',state:'open',responses:1,suppliers:3,value:75000,deadline:ahead(9),owner:'Rafael',initials:'RB'}
 ].map(q=>({...q,history:[{title:'Cotação criada',who:q.owner,at:'Exemplo inicial',note:q.room},...(q.state==='paused'?[{title:'Cotação pausada',who:q.owner,at:'Exemplo inicial',note:q.reason}]:[]),...(q.state==='canceled'?[{title:'Cotação cancelada',who:q.owner,at:'Exemplo inicial',note:q.reason}]:[])]}));}
let quotes=seed(),client=1,tab='open',search='',trigger=null,toastTimer;
const matches=(q,k)=>k==='all'?q.state!=='trash':k==='open'?['open','draft'].includes(q.state):q.state===k;
const code=q=>'COT-2026-'+String(40+q.id).padStart(4,'0');
const badge=q=>'<span class="status '+q.state+'">'+labels[q.state]+'</span>';
function toast(text){$('#toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',5500)}
function render(){closeMenu();if(!client){renderClients();return}const c=clients.find(x=>x.id===client),all=quotes.filter(q=>q.client===client),opened=all.filter(q=>matches(q,'open')),sum=opened.reduce((a,q)=>a+q.value,0);
 $('#app').innerHTML='<div class="breadcrumb"><button class="quiet" data-clients>← Cotações por cliente</button><span>/</span><span>'+esc(c.project)+'</span></div><header class="head"><div><h1>'+esc(c.name)+'</h1><p class="muted">Cotações do projeto · '+esc(c.project)+'</p></div><div class="head-note"><span class="dot"></span>Histórico preservado em cada ação</div></header><div class="kpis"><div class="kpi"><small>Em aberto</small><strong>'+opened.length+'</strong><div class="sub">'+money(sum)+' em estimativas</div></div><div class="kpi"><small>Pausadas</small><strong>'+all.filter(q=>q.state==='paused').length+'</strong><div class="sub">Aguardando retomada</div></div><div class="kpi"><small>Encerradas</small><strong>'+all.filter(q=>q.state==='closed').length+'</strong><div class="sub">Disponíveis para consulta</div></div><div class="kpi"><small>Canceladas</small><strong>'+all.filter(q=>q.state==='canceled').length+'</strong><div class="sub">Com motivo registrado</div></div></div><section class="panel"><div class="toolbar"><div class="toolbar-top"><label class="search" style="margin:0"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg><input id="search" aria-label="Buscar cotação" placeholder="Buscar serviço, número ou responsável…" value="'+esc(search)+'"></label><span class="toolbar-hint">Use <b>⋯</b> para gerenciar cada cotação</span></div><div class="tabs" role="tablist" aria-label="Situação das cotações">'+filters.map(([k,t])=>'<button role="tab" aria-selected="'+(tab===k)+'" class="'+(tab===k?'active':'')+'" data-tab="'+k+'">'+t+' <span class="count">'+all.filter(q=>matches(q,k)).length+'</span></button>').join('')+'</div></div><div class="list-head"><span>Cotação / serviço</span><span>Situação</span><span>Respostas</span><span>Prazo</span><span class="owner">Responsável</span><span></span></div><div id="rows" role="tabpanel"></div><footer class="list-footer"><span id="result-count"></span><div class="legend"><span><i></i>Links liberados em cotações ativas</span><span><i></i>Pausadas preservam as propostas</span></div></footer></section><div class="tip"><span class="symbol">↳</span><div><b>Experimente o menu ⋯ da Marcenaria.</b> Pause a cotação e veja o que muda para o fornecedor. Para testar a lixeira, use o rascunho de Iluminação.</div></div>';
 renderRows();$('#search').oninput=e=>{search=e.target.value;renderRows()};
}
function renderRows(){const needle=search.toLocaleLowerCase('pt-BR'),list=quotes.filter(q=>q.client===client&&matches(q,tab)&&[q.service,q.room,q.owner,code(q)].join(' ').toLocaleLowerCase('pt-BR').includes(needle));$('#result-count').textContent=list.length+' '+(list.length===1?'cotação':'cotações')+' nesta visualização';$('#rows').innerHTML=list.length?list.map(q=>'<article class="quote-row" data-status="'+q.state+'"><div class="quote-main"><button class="title-button" data-detail="'+q.id+'">'+esc(q.service)+'</button><div class="code">'+code(q)+' · '+esc(q.room)+'</div></div><div class="status-cell">'+badge(q)+(q.state==='paused'?'<div class="row-note">Links suspensos</div>':'')+'</div><div class="response-cell"><span class="mobile-label">Respostas</span><b>'+q.responses+'</b> / '+q.suppliers+' fornecedores<div class="progress"><span style="width:'+(q.suppliers?q.responses/q.suppliers*100:0)+'%"></span></div></div><div class="deadline-cell"><span class="mobile-label">Prazo:</span>'+(q.state==='paused'?'<span class="muted">Suspenso</span><div class="row-note">Anterior: '+date(q.deadline)+'</div>':q.state==='draft'?'<span class="muted">Ainda não enviada</span>':date(q.deadline))+'</div><div class="responsible"><span class="avatar">'+q.initials+'</span>'+q.owner+'</div><button class="more" data-menu="'+q.id+'" aria-label="Ações de '+esc(q.service)+'" aria-haspopup="menu" aria-expanded="false">⋯</button></article>').join(''):'<div class="empty"><h3>'+({'paused':'Nenhuma cotação pausada','trash':'A lixeira está vazia','archived':'Nenhuma cotação arquivada'}[tab]||'Nenhuma cotação encontrada')+'</h3><p>'+ (search?'Tente buscar outro serviço ou número.':'As cotações aparecerão aqui quando mudarem para esta situação.')+'</p></div>';}
function renderClients(){$('#app').innerHTML='<div class="breadcrumb">Cotações</div><header class="head"><div><h1>Cotações por cliente</h1><p class="muted">Escolha um cliente para gerenciar seus pedidos.</p></div></header><div class="client-cards">'+clients.map(c=>{const count=quotes.filter(q=>q.client===c.id&&matches(q,'open')).length;return '<button class="client-card" data-client="'+c.id+'"><span class="avatar">'+c.initials+'</span><h2>'+esc(c.name)+'</h2><p class="muted">'+esc(c.project)+'</p><div class="client-foot"><span>'+count+' em aberto</span><span>Acessar cotações →</span></div></button>'}).join('')+'</div>'}
function actions(q){let a=[['detail','↗','Ver cotação e histórico'],['supplier','◉','Visão do fornecedor']];if(q.state==='open')a.push(['pause','Ⅱ','Pausar cotação']);if(q.state==='paused')a.push(['resume','▷','Retomar cotação']);if(q.state==='canceled')a.push(['resume','↻','Reabrir cotação']);if(['open','paused','draft'].includes(q.state))a.push(['cancel','⊘','Cancelar cotação','red']);if(['closed','canceled'].includes(q.state))a.push(['archive','▣','Arquivar cotação']);if(q.state==='draft'&&!q.responses)a.push(['trash','×','Mover para a lixeira','red']);if(['archived','trash'].includes(q.state))a.push(['restore','↶','Restaurar cotação']);return a}
function closeMenu(){const m=$('#menu');m.hidden=true;if(trigger)trigger.setAttribute('aria-expanded','false')}
function openMenu(button,id){const q=quotes.find(q=>q.id===id),m=$('#menu');if(!m.hidden&&trigger===button){closeMenu();return}closeMenu();trigger=button;button.setAttribute('aria-expanded','true');m.innerHTML=actions(q).map(([a,icon,text,cls],i)=>(i===2?'<hr>':'')+'<button role="menuitem" class="'+(cls||'')+'" data-action="'+a+'" data-id="'+id+'"><span class="menu-icon" aria-hidden="true">'+icon+'</span>'+text+'</button>').join('')+(!['trash','draft'].includes(q.state)?'<small>Excluir fica disponível apenas para rascunhos sem respostas.</small>':'');m.hidden=false;const r=button.getBoundingClientRect();m.style.left=Math.max(10,Math.min(r.right-234,innerWidth-244))+'px';m.style.top=Math.max(10,Math.min(r.bottom+6,innerHeight-m.offsetHeight-10))+'px';m.querySelector('button').focus()}
function modal(content){const d=$('#modal');if(d.open)d.close();d.innerHTML=content;d.showModal();d.querySelector('[data-close]').onclick=()=>d.close();return d}
function heading(title,q){return '<div class="dialog-header"><div><h2>'+title+'</h2><p>'+esc(q.service)+' · '+code(q)+'</p></div><button type="button" class="x" data-close aria-label="Fechar">×</button></div>'}
function log(q,title,note){q.history.push({title,note:note||'',who:'Rafael Bernardes',at:new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',dateStyle:'short',timeStyle:'short'})})}
function detail(q){modal(heading('Detalhes da cotação',q)+badge(q)+'<div class="detail-grid"><div><small>Projeto</small><strong>'+esc(clients.find(c=>c.id===q.client).project)+'</strong></div><div><small>Respostas preservadas</small><strong>'+q.responses+' de '+q.suppliers+' fornecedores</strong></div><div><small>Valor estimado</small><strong>'+money(q.value)+'</strong></div><div><small>Responsável</small><strong>'+q.owner+'</strong></div></div><h3>Histórico de movimentações</h3><ol class="timeline">'+q.history.slice().reverse().map(h=>'<li><b>'+esc(h.title)+'</b><small>'+esc(h.who)+' · '+esc(h.at)+'</small>'+(h.note?'<p>'+esc(h.note)+'</p>':'')+'</li>').join('')+'</ol><div class="dialog-footer"><button data-close-footer>Voltar às cotações</button></div>').querySelector('[data-close-footer]').onclick=()=>$('#modal').close()}
function supplier(q){const state=q.state==='archived'?q.previous:q.state,info={paused:['Ⅱ','Cotação pausada','A Camber pausou este pedido. Sua proposta está preservada. Aguarde a retomada para continuar.'],canceled:['⊘','Cotação cancelada','Este pedido foi cancelado pela Camber e não aceita novas propostas.'],closed:['✓','Recebimento encerrado','O prazo de participação nesta cotação foi encerrado. Obrigado pela participação.'],draft:['◇','Pedido ainda não compartilhado','O escritório está preparando este pedido. O link será liberado quando a cotação for enviada.'],trash:['◇','Pedido indisponível','Este rascunho não está disponível para receber propostas.'],open:['↗','Cotação aberta','Você pode preencher sua proposta até '+date(q.deadline)+'.']}[state];const d=modal(heading('Visão do fornecedor',q)+'<div class="supplier-status"><div class="round">'+info[0]+'</div><h2>'+info[1]+'</h2><p>'+info[2]+'</p></div><button class="primary" style="width:100%" data-simulate '+(state!=='open'?'disabled':'')+'>'+(state==='open'?'Simular envio de proposta':'Envio indisponível')+'</button><p class="supplier-preview">Exemplo do aviso que o fornecedor verá no mesmo link.</p>');d.querySelector('[data-simulate]').onclick=()=>{d.close();toast('Simulação concluída. Nenhuma proposta ou e-mail foi enviado.')}}
function act(type,q){closeMenu();if(type==='detail'){detail(q);return}if(type==='supplier'){supplier(q);return}const config={pause:{title:'Pausar esta cotação?',tone:'paused',note:'Os links deixam de aceitar respostas até você retomar. As propostas já recebidas continuam disponíveis.',button:'Pausar cotação'},resume:{title:q.state==='paused'?'Retomar esta cotação?':'Reabrir esta cotação?',tone:'open',note:'Defina um novo prazo. Os mesmos links voltam a aceitar respostas e o histórico permanece preservado.',button:q.state==='paused'?'Retomar cotação':'Reabrir cotação'},cancel:{title:'Cancelar esta cotação?',tone:'canceled',note:'Os fornecedores não poderão enviar novas propostas. O motivo ficará registrado no histórico do escritório.',button:'Confirmar cancelamento'},archive:{title:'Arquivar esta cotação?',tone:'',note:'Ela sai da lista principal e fica disponível na aba Arquivadas. As propostas e o histórico continuam salvos.',button:'Arquivar cotação'},trash:{title:'Mover para a lixeira?',tone:'canceled',note:'Este rascunho não recebeu propostas. Você poderá recuperá-lo na aba Lixeira.',button:'Mover para a lixeira'},restore:{title:'Restaurar esta cotação?',tone:'open',note:'A cotação volta para a situação anterior: '+(labels[q.previous]||'Rascunho')+'. Restaurar não reabre automaticamente o recebimento de propostas.',button:'Restaurar cotação'}}[type];if(!config)return;
 let fields='';if(type==='pause')fields='<label>Motivo da pausa<select name="reason" required><option value="">Selecione um motivo</option><option>Aguardando decisão do cliente</option><option>Aguardando revisão do projeto</option><option>Obra suspensa</option><option>Outro motivo</option></select></label><label>Observação <span>· opcional</span><textarea name="note" placeholder="Detalhes para a equipe…" maxlength="500"></textarea></label>';if(type==='cancel')fields='<label>Motivo do cancelamento<select name="reason" required><option value="">Selecione um motivo</option><option>Cliente desistiu da contratação</option><option>Escopo alterado</option><option>Cotação duplicada</option><option>Contratação não será realizada</option><option>Outro motivo</option></select></label><label>Observação <span>· opcional</span><textarea name="note" maxlength="500" placeholder="Registre o contexto para futuras consultas…"></textarea></label>';if(type==='resume')fields='<label>Novo prazo para receber propostas<input type="date" name="deadline" min="'+today()+'" value="'+ahead(7)+'" required></label><div class="callout">Compartilhe a retomada com os fornecedores quando desejar. Nenhum e-mail será enviado automaticamente.</div>';const d=modal('<form>'+heading(config.title,q)+'<div class="callout '+config.tone+'">'+config.note+'</div>'+fields+(['pause','cancel'].includes(type)?'<ul class="checklist"><li>'+q.responses+' proposta(s) recebida(s) preservada(s)</li><li>Arquivos e histórico mantidos</li><li>Sem envio automático de e-mail</li></ul>':'')+'<p class="form-error" role="alert"></p><div class="dialog-footer"><button type="button" data-back>Voltar</button><button class="'+(['cancel','trash'].includes(type)?'danger':'primary')+'" type="submit">'+config.button+'</button></div></form>');d.querySelector('[data-back]').onclick=()=>d.close();d.querySelector('form').onsubmit=e=>{e.preventDefault();const form=new FormData(e.target),reason=form.get('reason')||'',note=[reason,form.get('note')].filter(Boolean).join(' · ');if(type==='resume'&&form.get('deadline')<today()){d.querySelector('.form-error').textContent='Escolha hoje ou uma data futura.';return}if(type==='trash'&&(q.state!=='draft'||q.responses)){d.querySelector('.form-error').textContent='Apenas rascunhos sem respostas podem ir para a lixeira.';return}if(type==='pause'){q.state='paused';q.reason=note;log(q,'Cotação pausada',note)}if(type==='resume'){q.state='open';q.deadline=form.get('deadline');log(q,config.button==='Retomar cotação'?'Cotação retomada':'Cotação reaberta','Novo prazo: '+date(q.deadline));q.reason=''}if(type==='cancel'){q.state='canceled';q.reason=note;log(q,'Cotação cancelada',note)}if(type==='archive'||type==='trash'){q.previous=q.state;q.state=type==='archive'?'archived':'trash';log(q,type==='archive'?'Cotação arquivada':'Movida para a lixeira')}if(type==='restore'){q.state=q.previous||'draft';delete q.previous;log(q,'Cotação restaurada','Situação: '+labels[q.state])}tab=q.state==='draft'?'open':q.state;search='';d.close();render();toast(q.service+' · '+labels[q.state]+'. Alteração registrada na prévia.');};
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(!e.target.closest('#menu'))closeMenu();return}if(b.dataset.menu){openMenu(b,Number(b.dataset.menu));return}if(!b.closest('#menu'))closeMenu();if(b.dataset.action){act(b.dataset.action,quotes.find(q=>q.id===Number(b.dataset.id)));return}if(b.dataset.detail)detail(quotes.find(q=>q.id===Number(b.dataset.detail)));if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.hasAttribute('data-clients')){client=null;render()}if(b.dataset.client){client=Number(b.dataset.client);tab='open';search='';render()}if(b.id==='reset'){quotes=seed();client=1;tab='open';search='';$('#modal').close();render();toast('Prévia reiniciada com os dados de exemplo.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#menu').hidden){closeMenu();trigger?.focus()}if(!$('#menu').hidden&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const bs=[...$('#menu').querySelectorAll('button')],i=bs.indexOf(document.activeElement);bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus()}});
window.addEventListener('resize',closeMenu);window.addEventListener('scroll',closeMenu,true);render();
</script>
</body>
</html>
