<body>
<div class="camber skin-studio" id="app" data-page="indicacoes">
  <div class="body scroll" style="display:flex;flex-direction:column">
    <div id="indiWrap">
      <iframe id="indiFrame" src="indicacoes-painel.html?v=1" title="Controle de Indicações"></iframe>

  </div>
</div>
<script src="projects-data.js?v=20260918-concurrency"></script>
<script src="shell.js?v=20260919-layout"></script>
<script>
  // a aba de Indicações (iframe) pede para abrir outra página do app
  window.addEventListener('message', function(e){
    var d = e && e.data;
    if(e.origin===location.origin && e.source===document.getElementById('indiFrame').contentWindow && d && d.type==='mabe-open' && typeof d.url==='string'){ window.location.href = d.url; }
  });
</script>
